[package]
name = "hermes-wa-voice"
version = "0.2.1-wa.opus.media.12"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "WhatsApp linked-device voice-call sidecar for WA Control & Live"
repository = "https://github.com/ashwanthbalakrishnan5/hermes-whatsapp-voice"
publish = false

[dependencies]
# Prepared from the pinned upstream revision by prepare_whatsapp_rust.py.
whatsapp-rust = { path = "../../.build/whatsapp-rust-relays", features = ["voip"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
libc = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
strip = true
